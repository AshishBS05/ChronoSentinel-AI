
services:
  web:
    image: nginxdemos/hello:plain-text
    container_name: chronosentinel-test-web
    expose:
      - "80"
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: chronosentinel-waf
    depends_on:
      - web
    ports:
      - "8080:8080"
    environment:
      BACKEND: "http://web:80"
      PORT: "8080"
      SERVER_NAME: "localhost"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    restart: unless-stopped


